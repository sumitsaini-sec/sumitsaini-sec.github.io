<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Portfolio layout review</title><style>body{margin:0;background:#263239;color:#fff;font:14px system-ui}header{display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;background:#263239;z-index:2}button,select{padding:7px}#stage{margin:18px auto;position:relative}iframe{border:0;transform-origin:top left;background:#080f13}pre{padding:20px;white-space:pre-wrap}</style><header><label>Viewport <select id="width"><option>1440</option><option>1366</option><option>1280</option><option>1024</option><option>768</option><option>430</option><option>390</option><option>375</option><option>360</option></select></label><label>Section <select id="section"><option>home</option><option>projects</option><option>about</option><option>skills</option><option>experience</option><option>workflow</option><option>investigation</option><option>resume</option><option>contact</option></select></label><button id="check">Check all widths</button><span id="state">Ready</span></header><div id="stage"><iframe id="site" title="Portfolio preview" src="/?design=amber"></iframe></div><pre id="results"></pre><script>
const site=document.querySelector('#site'),size=document.querySelector('#width'),stage=document.querySelector('#stage');
function resize(){const w=+size.value,s=Math.min(1,(innerWidth-36)/w);site.style.width=w+'px';site.style.height=(w<800?900:970)+'px';site.style.transform=`scale(${s})`;stage.style.width=w*s+'px';stage.style.height=(w<800?900:970)*s+'px'}
size.onchange=resize;onresize=resize;resize();document.querySelector('#section').onchange=e=>site.contentDocument.getElementById(e.target.value).scrollIntoView({behavior:'instant'});
const wait=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('#check').onclick=async()=>{const results=[];document.querySelector('#state').textContent='Checking';for(const w of [1440,1366,1280,1024,768,430,390,375,360]){size.value=w;resize();await wait(250);const d=site.contentDocument,errors=[];for(const section of d.querySelectorAll('main>section[id]')){section.scrollIntoView({behavior:'instant'});await wait(180);if(d.documentElement.scrollWidth>w)errors.push(section.id+': horizontal overflow');const heading=section.querySelector('h1,h2');if(heading&&heading.scrollWidth>heading.clientWidth+2)errors.push(section.id+': clipped heading');}results.push({width:w,pass:errors.length===0,errors});}document.querySelector('#results').textContent=JSON.stringify(results,null,2);document.querySelector('#state').textContent=results.every(x=>x.pass)?'All layout checks passed':'Check failed';};
</script></html>
