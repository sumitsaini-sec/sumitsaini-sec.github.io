<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio layout review</title><style>body{margin:0;background:#222;color:#fff;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{padding:9px;background:#fff;color:#111;border:0;border-radius:5px}#surface{position:relative;margin:0 auto}iframe{border:0;transform-origin:top left;display:block;background:#070b14}pre{white-space:pre-wrap;max-height:260px;overflow:auto;background:#10131c;padding:16px;margin:0;font:13px monospace}label{display:flex;align-items:center;gap:8px}</style></head><body><header><label>Viewport<select id="width"><option>1440</option><option>1366</option><option>1280</option><option>1024</option><option>768</option><option>430</option><option>390</option><option>375</option><option>360</option></select></label><button id="run">Run checks</button><label>Section<select id="section"><option value="home">Home</option><option value="projects">Projects</option><option value="about">About</option><option value="skills">Skills</option><option value="workflow">Workflow</option><option value="investigation">Lab</option><option value="experience">Experience</option><option value="journey">Training</option><option value="github">GitHub</option><option value="resume">Resume</option><option value="contact">Contact</option></select></label><button id="form">Toggle contact draft</button><button id="lab">Toggle lab</button><span id="state">Ready</span></header><pre id="results">Waiting for checks</pre><div id="surface"><iframe id="site" title="Portfolio responsive preview" src="/" width="1440" height="960"></iframe></div><script>
const site=document.getElementById('site'),surface=document.getElementById('surface'),width=document.getElementById('width'),results=document.getElementById('results'),state=document.getElementById('state');const pause=ms=>new Promise(r=>setTimeout(r,ms));
function resize(n){site.width=n;site.height=n<600?844:960;const scale=Math.min(1,(innerWidth-24)/n);site.style.transform=`scale(${scale})`;surface.style.width=n*scale+'px';surface.style.height=Number(site.height)*scale+'px'}
width.onchange=()=>resize(+width.value);window.onresize=()=>resize(+width.value);resize(1440);
const doc=()=>site.contentDocument,win=()=>site.contentWindow;const click=(s)=>{const e=doc().querySelector(s);if(!e)throw Error('Missing '+s);e.click()};const visible=e=>e&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0&&win().getComputedStyle(e).visibility!=='hidden';
document.getElementById('section').onchange=e=>doc().getElementById(e.target.value)?.scrollIntoView({behavior:'instant',block:'start'});document.getElementById('form').onclick=()=>click('.contact-compose>summary');document.getElementById('lab').onclick=()=>click('.demo-details>summary');
let report=[];function record(name,pass,info=''){report.push({name,pass,info});results.textContent=JSON.stringify(report,null,2)}
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;report=[];try{
for(const n of [1440,1366,1280,1024,768,430,390,375,360]){state.textContent='Checking '+n;resize(n);width.value=n;await pause(200);const d=doc(),w=win();let issues=[];
 for(const id of ['home','projects','about','skills','workflow','investigation','experience','journey','github','resume','contact']){d.getElementById(id).scrollIntoView({behavior:'instant',block:'start'});await pause(90);if(d.documentElement.scrollWidth>w.innerWidth+1)issues.push(id+': horizontal overflow');const active=d.querySelector('.nav-links [aria-current]')?.getAttribute('href');const expected=['home','projects','about','skills','experience','resume','contact'].includes(id)?'#'+id:undefined;if(active!==expected)issues.push(id+': active '+active+' expected '+expected);const target=d.querySelector('#'+id+' h1,#'+id+' h2');if(target&&target.getBoundingClientRect().top<d.querySelector('header').getBoundingClientRect().bottom-1)issues.push(id+': covered heading');}
 const headings=[...d.querySelectorAll('h1,h2,h3,.hero-role,.project-title-button')].filter(visible).filter(e=>e.scrollWidth>e.clientWidth+2);if(headings.length)issues.push('clipped '+headings.map(e=>e.textContent).join('|'));
 record('Layout / anchors / scroll-spy '+n,issues.length===0,issues);record('Mobile stepper '+n,n>600||visible(d.querySelector('.workflow-mobile')));
}
resize(390);width.value=390;await pause(200);click('button[aria-label="Open navigation"]');await pause(250);record('Mobile dialog opens',visible(doc().querySelector('[role="dialog"]')));const a=doc().querySelector('.mobile-links a[href="#skills"]');a.click();await pause(850);record('Mobile menu selection and focus',!doc().querySelector('[role="dialog"]')&&doc().activeElement.id==='skills'&&doc().querySelector('.nav-links [aria-current]')?.getAttribute('href')==='#skills');
click('.workflow-mobile .workflow-accordion:nth-child(3) button');await pause(200);record('Mobile stepper interaction',doc().querySelector('#mobile-stage-2').hidden===false);click('.toolkit-details>summary');await pause(150);record('Tool expansion',visible(doc().querySelector('.tools-grid')));
click('.demo-details>summary');await pause(150);click('[aria-label="Bookmark AUTH-01"]');record('Evidence bookmark',doc().querySelector('[aria-label="Remove bookmark AUTH-01"]')?.getAttribute('aria-pressed')==='true');for(const label of ['Check IP','Inspect host','View timeline']){[...doc().querySelectorAll('[role="tab"]')].find(e=>e.textContent.trim()===label).click();await pause(90)}record('Evidence review unlocks handoff',!doc().querySelector('.handoff-button').disabled);click('.handoff-button');await pause(150);record('Handoff rendered',visible(doc().querySelector('.handoff')));click('.handoff button');await pause(100);record('Complete case record',doc().querySelectorAll('.case-record>div').length===14);click('[aria-label="Reset investigation"]');record('Demo reset',doc().querySelector('.handoff-button').disabled&&!doc().querySelector('.handoff'));
click('.journey-details>summary');await pause(100);click('.journey-stage:nth-child(6)');await pause(100);record('Learning path',doc().querySelector('.journey-detail strong').textContent==='Phishing investigation');
for(let i=0;i<3;i++){doc().querySelectorAll('.project-title-button')[i].click();await pause(250);let dia=doc().querySelector('[role="dialog"]');record('Case study '+(i+1),visible(dia)&&dia.textContent.includes('Actions performed')&&dia.scrollWidth<=dia.clientWidth+1);if(i===0){dia.querySelector('.architecture-details>summary').click();await pause(100);record('Case architecture expandable',visible(dia.querySelector('.architecture-list')));}click('[aria-label="Close case study"]');await pause(250)}
click('.contact-compose>summary');await pause(100);click('.contact-form button[type="submit"]');await pause(100);record('Contact invalid input feedback',doc().querySelectorAll('.field-error').length===4&&doc().activeElement.id==='contact-name');
function fill(id,value){const e=doc().getElementById(id);const proto=e.tagName==='TEXTAREA'?win().HTMLTextAreaElement.prototype:win().HTMLInputElement.prototype;Object.getOwnPropertyDescriptor(proto,'value').set.call(e,value);e.dispatchEvent(new(win().Event)('input',{bubbles:true}));}
fill('contact-name','QA Reviewer');fill('contact-email','review@example.com');fill('contact-subject','Portfolio review');fill('contact-message','This local test checks the email draft only. Nothing is sent.');await pause(100);click('.contact-form button[type="submit"]');await pause(100);record('Contact prepares draft without sending',visible(doc().querySelector('.email-ready'))&&doc().querySelector('.email-ready a')?.getAttribute('href').startsWith('mailto:'));
const missing=[...doc().images].filter(e=>visible(e)&&e.complete&&e.naturalWidth===0).map(e=>e.src);record('Loaded images',missing.length===0,missing);record('No fake href links',![...doc().links].some(e=>e.getAttribute('href')==='#'));
record('SEO sharing metadata',!!doc().querySelector('meta[property="og:image"]')&&doc().querySelector('meta[name="twitter:card"]')?.content==='summary_large_image');record('All inputs labelled',[...doc().querySelectorAll('input:not([type=hidden]),textarea')].every(e=>e.labels?.length||e.getAttribute('aria-label')));
state.textContent='Complete: '+report.filter(r=>r.pass).length+'/'+report.length+' passed';
}catch(e){record('Runner error',false,e.message);state.textContent='Check failed'}finally{document.getElementById('run').disabled=false}}
</script></body></html>
